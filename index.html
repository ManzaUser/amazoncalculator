<script type="text/babel">
const { useState, useRef, useCallback, useMemo } = React;
const XLSX = window.XLSX;
const Papa = window.Papa;

// ─── Parse TARIFF (standard sheet_to_json, row 1 = headers) ──────────────────
function parseTariffFile(file, hdrRow) {
  if (!hdrRow) hdrRow = 1;
  return new Promise(function(res, rej) {
    var name = file.name.toLowerCase();
    if (name.endsWith(".csv") || name.endsWith(".txt")) {
      var r = new FileReader();
      r.onload = function(e) {
        try {
          var result = hdrRow <= 1
            ? Papa.parse(e.target.result, { header: true, skipEmptyLines: true, dynamicTyping: false })
            : (function() { var r = Papa.parse(e.target.result, { header: false, skipEmptyLines: true }); var rows = r.data; var hdrs = rows[hdrRow-1] || []; var data = rows.slice(hdrRow).map(function(row) { var obj = {}; hdrs.forEach(function(h,i){ obj[String(h).trim()] = row[i] || ""; }); return obj; }); return { data: data }; })();
          if (!result.data || result.data.length === 0) { rej(new Error("El CSV esta vacio.")); return; }
          var cleaned = result.data.map(function(row) {
            var out = {};
            Object.keys(row).forEach(function(k) { if (k && !k.startsWith("__EMPTY")) out[k.trim()] = row[k]; });
            return out;
          });
          res(cleaned);
        } catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r.readAsText(file, "UTF-8");
    } else {
      var r2 = new FileReader();
      r2.onload = function(e) {
        try {
          var wb = XLSX.read(e.target.result, { type: "array" });
          var ws = wb.Sheets[wb.SheetNames[0]];
          if (!ws || !ws["!ref"]) { rej(new Error("Hoja vacia en " + file.name)); return; }
          var raw = XLSX.utils.sheet_to_json(ws, { defval: "", range: hdrRow - 1 });
          if (raw.length === 0) {
            var rng = XLSX.utils.decode_range(ws["!ref"]);
            rej(new Error("Sin datos. Rango: " + ws["!ref"] + " (" + (rng.e.r + 1) + " filas). Asegurate de que la cabecera este en fila 1.")); return;
          }
          var cleaned2 = raw.map(function(row) {
            var out = {};
            Object.keys(row).forEach(function(k) { if (k && !k.startsWith("__EMPTY")) out[k.trim()] = row[k]; });
            return out;
          });
          res(cleaned2);
        } catch(err) { rej(err); }
      };
      r2.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r2.readAsArrayBuffer(file);
    }
  });
}

// ─── Parse AMAZON (cell-by-cell, stores by header name AND _col_X) ────────────
function parseAmazonFile(file, headerRow) {
  return new Promise(function(res, rej) {
    var name = file.name.toLowerCase();
    var hIdx = headerRow - 1;

    function buildRows(rawRows) {
      if (rawRows.length <= hIdx) return [];
      var headers = rawRows[hIdx].map(function(h) { return String(h != null ? h : "").trim(); });
      var data = [];
      for (var r = hIdx + 1; r < rawRows.length; r++) {
        var row = {}; var hasData = false;
        for (var ci = 0; ci < rawRows[r].length; ci++) {
          var val    = rawRows[r][ci] != null ? rawRows[r][ci] : "";
          var colKey = "_col_" + XLSX.utils.encode_col(ci);
          var hName  = headers[ci] || "";
          row[colKey] = val;
          if (hName) row[hName] = val;
          if (String(val).trim() !== "") hasData = true;
        }
        if (hasData) data.push(row);
      }
      return data;
    }

    function parseAsText(text) {
      // Try tab-separated first, then comma
      var sep = text.indexOf("\t") > -1 ? "\t" : ",";
      var result = Papa.parse(text, { header: false, skipEmptyLines: true, delimiter: sep });
      return buildRows(result.data);
    }

    function tryXLSX(buffer) {
      try {
        // Suppress XLSX console noise during parse
        var _origError = console.error;
        var _origWarn  = console.warn;
        console.error = function() {};
        console.warn  = function() {};
        var wb;
        try {
          wb = XLSX.read(buffer, { type: "array", WTF: false, cellNF: false, cellStyles: false, cellDates: false });
        } finally {
          console.error = _origError;
          console.warn  = _origWarn;
        }
        var ws = wb.Sheets[wb.SheetNames[0]];
        if (!ws || !ws["!ref"]) return null;
        var range = XLSX.utils.decode_range(ws["!ref"] || "A1");
        var rawRows = [];
        for (var ri = range.s.r; ri <= range.e.r; ri++) {
          var row2 = [];
          for (var ci = range.s.c; ci <= range.e.c; ci++) {
            var cell = ws[XLSX.utils.encode_cell({ r: ri, c: ci })];
            row2.push(cell != null ? (cell.w || String(cell.v != null ? cell.v : "")) : "");
          }
          rawRows.push(row2);
        }
        return buildRows(rawRows);
      } catch(e) { return null; }
    }

    if (name.endsWith(".csv") || name.endsWith(".txt")) {
      var r = new FileReader();
      r.onload = function(e) {
        try { res(parseAsText(e.target.result)); }
        catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r.readAsText(file, "UTF-8");
    } else {
      // Try as binary Excel first, fall back to reading as text (some Amazon exports are TSV with .xlsx extension)
      var r2 = new FileReader();
      r2.onload = function(e) {
        var xlsxResult = tryXLSX(e.target.result);
        if (xlsxResult && xlsxResult.length > 0) {
          res(xlsxResult);
        } else {
          // Fallback: read as text (handles TSV/CSV disguised as xlsx)
          var r3 = new FileReader();
          r3.onload = function(e2) {
            try { res(parseAsText(e2.target.result)); }
            catch(err) { rej(new Error("No se pudo leer el archivo. Prueba a exportarlo como CSV desde Excel.")); }
          };
          r3.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
          r3.readAsText(file, "UTF-8");
        }
      };
      r2.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r2.readAsArrayBuffer(file);
    }
  });
}

// ─── Auto-detect helpers ──────────────────────────────────────────────────────
function detectTariffCols(headers) {
  function find(pats) {
    for (var i = 0; i < headers.length; i++) {
      for (var j = 0; j < pats.length; j++) {
        if (pats[j].test(String(headers[i]).trim())) return headers[i];
      }
    }
    return null;
  }
  return {
    sku:   find([/^sku$/i, /^ref/i, /^cod/i, /^referencia/i, /^codigo/i, /^articulo/i]),
    model: find([/descrip/i, /nombre/i, /product/i, /modelo/i, /articulo/i]),
    price: find([/coste.euros/i, /coste.eur/i, /coste.unit/i, /precio.unit/i, /p\.unit/i, /^precio$/i, /^coste$/i, /^cost$/i, /^pvp$/i, /unit.price/i, /^price$/i]),
    curr:  find([/moneda/i, /currency/i, /divisa/i]),
  };
}

function detectAmazonCols(headers) {
  function find(pats) {
    for (var i = 0; i < headers.length; i++) {
      if (/^_col_/.test(headers[i])) continue;
      for (var j = 0; j < pats.length; j++) {
        if (pats[j].test(String(headers[i]))) return headers[i];
      }
    }
    return null;
  }
  return {
    sku:     find([/^sku$/i, /seller.?sku/i]),
    asin:    find([/^asin$/i]),
    product: find([/^title$/i, /^titulo$/i, /product.?name/i, /nombre.?del.?producto/i, /^nombre/i, /descripci/i]),
  };
}

// ─── Number helpers ───────────────────────────────────────────────────────────
function toNum(v) {
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  var s = String(v).trim().replace(/[€$£%\s]/g, "");
  if (/\.\d{3}(,|$)/.test(s) || (s.indexOf(",") > -1 && s.indexOf(".") > -1)) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else {
    s = s.replace(",", ".");
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function toPct(v) {
  if (v == null || v === "") return null;
  var s = String(v).trim();
  var n = parseFloat(s.replace("%", "").replace(",", "."));
  if (isNaN(n)) return null;
  return s.indexOf("%") > -1 ? n / 100 : n;
}

function normSKU(s) {
  return String(s != null ? s : "").trim().toUpperCase().replace(/\s+/g, " ");
}

// ─── Formatters ───────────────────────────────────────────────────────────────
function n2(v, d) {
  if (d === undefined) d = 2;
  if (v == null) return "-";
  return Number(v).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fEUR(v) { return v == null ? "-" : "\u20ac" + n2(v); }
function fUSD(v) { return v == null ? "-" : "$" + n2(v); }
function fPct(v) { return v == null ? "-" : n2(v * 100, 1) + "%"; }
function bCol(v) { return v == null ? "#334155" : v >= 0 ? "#4ade80" : "#f87171"; }

// ─── Styles ───────────────────────────────────────────────────────────────────
var S = {
  wrap: { minHeight: "100vh", background: "#0b1120", color: "#e2e8f0", fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" },

  btnP: { background: "#1d4ed8", color: "#fff", border: "none", borderRadius: 10, padding: "10px 28px", fontWeight: 700, fontSize: 14, cursor: "pointer" },

  thL:  { padding: "10px 12px", fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".05em", textAlign: "left",   borderBottom: "1px solid #1e2d4a", color: "#475569", whiteSpace: "nowrap", cursor: "pointer", background: "#0a1525", position: "sticky", top: 0, zIndex: 2 },
  thC:  { padding: "10px 12px", fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".05em", textAlign: "center", borderBottom: "1px solid #1e2d4a", color: "#475569", whiteSpace: "nowrap", background: "#0a1525", position: "sticky", top: 0, zIndex: 2 },
  tdR:  { padding: "9px 12px", fontSize: 13, textAlign: "right",  borderBottom: "1px solid #0a1020" },
  tdL:  { padding: "9px 12px", fontSize: 13, textAlign: "left",   borderBottom: "1px solid #0a1020" },

};

// ─── DropFile ─────────────────────────────────────────────────────────────────
function DropFile(props) {
  var isDragState = useState(false);
  var isDrag = isDragState[0], setDrag = isDragState[1];
  var ref = useRef(null);
  return (
    <div
      onDragOver={function(e) { e.preventDefault(); setDrag(true); }}
      onDragLeave={function() { setDrag(false); }}
      onDrop={function(e) { e.preventDefault(); setDrag(false); var f = e.dataTransfer.files[0]; if (f) props.onFile(f); }}
      onClick={function() { if (ref.current) ref.current.click(); }}
      style={{ border: "2px dashed " + (isDrag ? props.color : props.file ? props.color + "99" : "#1e3a5f"), background: props.file ? props.color + "12" : "#0d1829", borderRadius: 14, padding: 22, textAlign: "center", cursor: "pointer" }}
    >
      <input ref={ref} type="file" accept={props.accept} style={{ display: "none" }} onChange={function(e) { if (e.target.files[0]) props.onFile(e.target.files[0]); }} />
      <div style={{ fontSize: 28, marginBottom: 8 }}>{props.icon}</div>
      <div style={{ fontWeight: 700, color: "#e2e8f0", fontSize: 14 }}>{props.label}</div>
      <div style={{ fontSize: 12, color: "#475569", marginTop: 4 }}>{props.desc}</div>
      {props.file
        ? <div style={{ fontSize: 12, color: props.color, marginTop: 10, fontWeight: 600 }}>{"✓ " + props.file.name}</div>
        : <div style={{ fontSize: 11, color: "#334155", marginTop: 10, border: "1px solid #1e3a5f", borderRadius: 6, padding: "3px 12px", display: "inline-block" }}>Arrastra o haz clic</div>}
    </div>
  );
}

// ─── ColPick ──────────────────────────────────────────────────────────────────
function ColPick(props) {
  var nameHeaders = props.headers.filter(function(h) { return !String(h).startsWith("_col_"); });
  var preview = null;
  if (props.value && props.data && props.data.length > 0) {
    preview = props.data.slice(0, 3).map(function(r) { return String(r[props.value] != null ? r[props.value] : ""); }).filter(Boolean).join("  ·  ");
  }
  return (
    <div>
      <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 5, fontWeight: 600 }}>
        {props.label}{props.required !== false && <span style={{ color: "#f87171", marginLeft: 4 }}>*</span>}
      </div>
      <select value={props.value || ""} onChange={function(e) { props.onChange(e.target.value || null); }} style={S.sel}>
        <option value="">— no usar —</option>
        {nameHeaders.map(function(h) { return <option key={h} value={h}>{h}</option>; })}
      </select>
      {preview && <div style={{ fontSize: 11, color: "#4ade80", marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{"ej: " + preview}</div>}
    </div>
  );
}

// ─── ColLetter ────────────────────────────────────────────────────────────────
function ColLetter(props) {
  var col    = "_col_" + String(props.value || "").toUpperCase();
  var exists = props.value && props.data && props.data.length > 0 && props.data[0][col] !== undefined;
  var preview = exists ? props.data.slice(0, 2).map(function(r) { var v = r[col]; return v != null && v !== "" ? String(v).slice(0, 20) : null; }).filter(Boolean).join("  ·  ") : null;
  return (
    <div>
      <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 5, fontWeight: 600 }}>{props.label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <input value={props.value} onChange={function(e) { props.onChange(e.target.value.toUpperCase()); }}
          style={{ background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 10, padding: "6px 8px", color: "#e2e8f0", fontSize: 14, fontWeight: 700, fontFamily: "monospace", outline: "none", width: 56, textAlign: "center" }}
          placeholder="A" />
        {props.hint && <span style={{ fontSize: 11, color: "#334155" }}>{props.hint}</span>}
      </div>
      {props.value && (exists
        ? <div style={{ fontSize: 11, color: "#4ade80", marginTop: 3 }}>{"✓ " + (preview || "(vacia)")}</div>
        : <div style={{ fontSize: 11, color: "#f87171", marginTop: 3 }}>Columna no encontrada</div>)}
    </div>
  );
}

// ─── SortTh ───────────────────────────────────────────────────────────────────
function SortTh(props) {
  var active = props.sortBy === props.col;
  var base   = props.left ? S.thL : S.thR;
  return (
    <th onClick={function() { props.onSort(props.col); }} style={Object.assign({}, base, { color: active ? "#60a5fa" : "#475569" })}>
      {props.label + (active ? (props.sortDir === "asc" ? " \u2191" : " \u2193") : " \u2195")}
    </th>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  var s1 = useState("upload");      var step = s1[0], setStep = s1[1];
  var s2 = useState(null);          var tariffFile = s2[0], setTariffFile = s2[1];
  var s3 = useState(null);          var amazonFile = s3[0], setAmazonFile = s3[1];
  var s4 = useState([]);            var tariffData = s4[0], setTariffData = s4[1];
  var s5 = useState([]);            var amazonData = s5[0], setAmazonData = s5[1];
  var s6 = useState(2);             var amazonHdrRow = s6[0], setAmazonHdrRow = s6[1];
  var s23 = useState(1);             var tariffHdrRow = s23[0], setTariffHdrRow = s23[1];
  var s7 = useState(false);         var parsing = s7[0], setParsing = s7[1];
  var s8 = useState(null);          var fileErr = s8[0], setFileErr = s8[1];
  var s9 = useState({ sku: null, model: null, price: null, curr: null });
  var tMap = s9[0], setTMap = s9[1];
  var s10 = useState({ sku: null, asin: null, product: null, colF: "F", colG: "G", colP: "P", colQ: "Q", colS: "S", colNC: "NC", colNI: "NI", colNF: "NF", colIO: "IO", colO: "O", colFN: "FN", colHB: "HB", colAZ: "AZ", colAR: "AR", colDY: "DY", colHS: "HS" });
  var aMap = s10[0], setAMap = s10[1];
  var _savedRate = (function() { try { var v = parseFloat(localStorage.getItem("eurUsd")); return v > 0 ? v : 1.085; } catch(e) { return 1.085; } })();
  var s11 = useState({ eurUsd: _savedRate, reportDays: 30, shippingTotal: 0, shippingCurrency: "EUR" });
  var config = s11[0], setConfig = s11[1];
  var s12 = useState(null);         var rows = s12[0], setRows = s12[1];
  var s13 = useState(null);         var matchInfo = s13[0], setMatchInfo = s13[1];
  var s15 = useState("");           var search = s15[0], setSearch = s15[1];
  var s20 = useState(false);          var hideNoCost = s20[0], setHideNoCost = s20[1];
  var s21 = useState(30);             var targetMargin = s21[0], setTargetMargin = s21[1];
  var s25 = useState("");              var rateStatus = s25[0], setRateStatus = s25[1];
  var s22 = useState(true);            var showMatchWarning = s22[0], setShowMatchWarning = s22[1];
  var s26 = useState(false);           var showConfig = s26[0], setShowConfig = s26[1];
  var s24 = useState(false);           var hideNoSales = s24[0], setHideNoSales = s24[1];
  var s19 = useState({});           var colFilters = s19[0], setColFilters = s19[1];
  var s16 = useState("ingresosNetos"); var sortC = s16[0], setSortC = s16[1];
  var s17 = useState("desc");       var sortD = s17[0], setSortD = s17[1];
  var s27 = useState(false);           var showColMenu = s27[0], setShowColMenu = s27[1];

  var tariffHeaders = tariffData.length > 0 ? Object.keys(tariffData[0]) : [];
  var amazonHeaders = amazonData.length > 0 ? Object.keys(amazonData[0]) : [];

  function loadTariff(file, overrideRow) {
    setFileErr(null); setParsing(true);
    var row = overrideRow != null ? overrideRow : tariffHdrRow;
    parseTariffFile(file, row).then(function(data) {
      setTariffFile(file); setTariffData(data);
      setTMap(detectTariffCols(Object.keys(data[0])));
      setParsing(false);
    }).catch(function(e) { setFileErr("Tarifa: " + e.message); setParsing(false); });
  }

  function loadAmazon(file, overrideRow) {
    setFileErr(null); setParsing(true);
    var row = overrideRow != null ? overrideRow : amazonHdrRow;
    parseAmazonFile(file, row).then(function(data) {
      if (!data || data.length === 0) { setFileErr("Amazon: informe vacio con esa fila de cabecera."); setParsing(false); return; }
      setAmazonFile(file); setAmazonData(data);
      var detected = detectAmazonCols(Object.keys(data[0]));
      setAMap(function(m) { return Object.assign({}, m, detected); });
      setParsing(false);
    }).catch(function(e) { setFileErr("Amazon: " + e.message); setParsing(false); });
  }

  function fetchRate() {
    setRateStatus("cargando");
    function applyRate(rate) {
      var r = parseFloat(rate.toFixed(4));
      setConfig(function(prev) { return Object.assign({}, prev, { eurUsd: r }); });
      setRateStatus("ok:" + r);
      try { localStorage.setItem("eurUsd", r); } catch(e) {}
    }
    function trySource1() {
      // jsDelivr CDN - works from file:// and any origin
      return fetch("https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json")
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.eur && d.eur.usd) { applyRate(d.eur.usd); return true; }
          throw new Error("no data");
        });
    }
    function trySource2() {
      return fetch("https://api.frankfurter.app/latest?from=EUR&to=USD")
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.rates && d.rates.USD) { applyRate(d.rates.USD); return true; }
          throw new Error("no data");
        });
    }
    function trySource3() {
      return fetch("https://open.er-api.com/v6/latest/EUR")
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.rates && d.rates.USD) { applyRate(d.rates.USD); return true; }
          throw new Error("no data");
        });
    }
    trySource1()
      .catch(function() { return trySource2(); })
      .catch(function() { return trySource3(); })
      .catch(function() { setRateStatus("error"); });
  }

  function calculate() {
    setFileErr(null);
    if (!amazonData.length) { setFileErr("Sube el informe de Amazon primero."); return; }
    var tariffLookup = {};
    var tariffSkuList = [];
    for (var ti = 0; ti < tariffData.length; ti++) {
      var trow = tariffData[ti];
      var tsku = tMap.sku ? normSKU(trow[tMap.sku]) : "";
      var tmod = tMap.model ? String(trow[tMap.model] != null ? trow[tMap.model] : "").trim().toLowerCase() : "";
      var tprice = toNum(tMap.price ? trow[tMap.price] : 0);
      var tcurr = tMap.curr ? String(trow[tMap.curr] != null ? trow[tMap.curr] : "EUR").trim().toUpperCase() : "EUR";
      var tpriceEUR = tcurr === "USD" ? tprice / config.eurUsd : tprice;
      if (tsku) { tariffLookup[tsku] = tpriceEUR; tariffSkuList.push(tsku); }
      if (tmod) tariffLookup[tmod] = tpriceEUR;
    }
    var totalUnits = 0;
    for (var ai = 0; ai < amazonData.length; ai++) { totalUnits += toNum(amazonData[ai]["_col_" + aMap.colP]); }
    var shipUSD = config.shippingCurrency === "EUR" ? config.shippingTotal * config.eurUsd : config.shippingTotal;
    var result = [];
    for (var ai2 = 0; ai2 < amazonData.length; ai2++) {
      var row = amazonData[ai2];
      function gc(k) { return row["_col_" + k]; }
      var rawSku = aMap.sku ? row[aMap.sku] : "";
      var asin = aMap.asin ? String(row[aMap.asin] != null ? row[aMap.asin] : "").trim() : "";
      var sku = normSKU(rawSku);
      var producto = aMap.product ? String(row[aMap.product] != null ? row[aMap.product] : "").trim() : "";
      var skuShort = sku.split("-").slice(0, -1).join("-");
      var costeEUR = tariffLookup[sku] != null ? tariffLookup[sku] : (tariffLookup[skuShort] != null ? tariffLookup[skuShort] : (tariffLookup[producto.toLowerCase()] != null ? tariffLookup[producto.toLowerCase()] : null));
      var costeUSD = costeEUR != null ? costeEUR * config.eurUsd : null;
      var unidsVendidas = toNum(gc(aMap.colP));
      var shippingCost = totalUnits > 0 ? (unidsVendidas / totalUnits) * shipUSD : 0;
      var publicidad = toNum(gc(aMap.colNC)) + toNum(gc(aMap.colNI));
      var ingresosNetos = toNum(gc(aMap.colF));
      var beneficioUSD = ingresosNetos - (costeUSD != null ? costeUSD : 0) - publicidad - shippingCost;
      var beneficioEUR = beneficioUSD / config.eurUsd;
      var pctBeneficio = ingresosNetos !== 0 ? (beneficioUSD / ingresosNetos) * 100 : null;
      if (unidsVendidas > 0 || ingresosNetos > 0) {
        var acos = toPct(gc(aMap.colNF));
        var comision = toNum(gc(aMap.colFN)) + toNum(gc(aMap.colHB));
        var dias365 = (gc(aMap.colIO) != null && String(gc(aMap.colIO)).trim() !== "") ? "SI" : "No";
        var gastosFBA = toNum(gc(aMap.colAZ)) + toNum(gc(aMap.colAR)) + toNum(gc(aMap.colDY)) + toNum(gc(aMap.colHS));
        var pvp = toNum(gc(aMap.colO));
        var precioUnidad = toNum(gc(aMap.colG));
        var beneficio = costeEUR != null ? (precioUnidad - (costeEUR * config.eurUsd)) : null;
        var beneficioPct = (beneficio != null && pvp !== 0) ? (beneficio / pvp) * 100 : null;
        var precioSugerido = null; // computed dynamically from targetMargin
        result.push({ sku: sku, asin: asin, producto: producto, costeEUR: costeEUR, costeUSD: costeUSD, pvp: pvp, precioUnidad: precioUnidad, unidadesVendidas: unidsVendidas, devolucion: toNum(gc(aMap.colQ)), ratioDevoluciones: toPct(gc(aMap.colS)), publicidad: publicidad, ingresosNetos: ingresosNetos, shippingCost: shippingCost, beneficioUSD: beneficioUSD, beneficioEUR: beneficioEUR, pctBeneficio: pctBeneficio, acos: acos, beneficio: beneficio, beneficioPct: beneficioPct, precioSugerido: precioSugerido, comision: comision, dias365: dias365, gastosFBA: gastosFBA, hasTariff: costeEUR != null });
      }
    }
    var matched = result.filter(function(r) { return r.hasTariff; }).length;
    var amzSkus = result.map(function(r) { return r.sku; }).filter(Boolean).slice(0, 8);
    var unmatch = result.filter(function(r) { return !r.hasTariff; }).map(function(r) { return r.sku || r.producto; }).slice(0, 8);
    setShowMatchWarning(true);
    setMatchInfo({ matched: matched, total: result.length, amzSkus: amzSkus, tarSkus: tariffSkuList.slice(0, 8), unmatched: unmatch });
    setRows(result); setStep("results");
  }

  function doSort(col) {
    if (sortC === col) setSortD(function(d) { return d === "asc" ? "desc" : "asc"; });
    else { setSortC(col); setSortD("desc"); }
  }

  var sorted = useMemo(function() {
    if (!rows) return [];
    var r = rows.slice();
    if (search) { var q = search.toLowerCase(); r = r.filter(function(x) { return x.sku.toLowerCase().indexOf(q) > -1 || x.producto.toLowerCase().indexOf(q) > -1 || (x.asin && x.asin.toLowerCase().indexOf(q) > -1); }); }
    if (hideNoSales) { r = r.filter(function(x) { return x.unidadesVendidas > 0; }); }
    if (hideNoCost) { r = r.filter(function(x) { return x.costeEUR != null; }); }
    // Column filters
    var filterKeys = Object.keys(colFilters);
    for (var fi = 0; fi < filterKeys.length; fi++) {
      var fk = filterKeys[fi]; var fv = colFilters[fk];
      if (!fv || !fv.trim()) continue;
      var fvLow = fv.toLowerCase().trim();
      r = r.filter(function(row) {
        var val = row[fk];
        if (val == null) return false;
        return String(val).toLowerCase().indexOf(fvLow) > -1;
      });
    }
    r.sort(function(a, b) { var av = a[sortC] != null ? a[sortC] : 0; var bv = b[sortC] != null ? b[sortC] : 0; return sortD === "asc" ? av - bv : bv - av; });
    return r;
  }, [rows, search, colFilters, hideNoCost, hideNoSales, sortC, sortD]);
  function sumF(k) { return sorted.reduce(function(s, r) { return s + (r[k] || 0); }, 0); }

  var ALL_COLS = [
    { key: "sku",              label: "SKU",          idx: 1  },
    { key: "asin",             label: "ASIN",         idx: 2  },
    { key: "producto",         label: "Producto",     idx: 3  },

    { key: "costeUSD",         label: "Coste USD",    idx: 5  },
    { key: "pvp",              label: "PVP",          idx: 6  },
    { key: "precioUnidad",     label: "Neto",         idx: 7  },
    { key: "unidadesVendidas", label: "Ventas",       idx: 8  },
    { key: "devolucion",       label: "Devolucion",   idx: 9  },
    { key: "ratioDev",         label: "Ratio dev.",   idx: 10 },
    { key: "gastosFBA",        label: "Gastos FBA",   idx: 11 },
    { key: "comision",         label: "Comision",     idx: 12 },
    { key: "publicidad",       label: "Publicidad",   idx: 13 },
    { key: "acos",             label: "ACoS",         idx: 14 },
    { key: "beneficio",        label: "Beneficio",    idx: 15 },
    { key: "beneficioPct",     label: "Beneficio %",  idx: 16 },
    { key: "pvpr",             label: "PVPR",         idx: 17 },
    { key: "dias365",          label: "+ 365 dias",   idx: 18 },
    { key: "ingresosNetos",    label: "Total",        idx: 19 },
  ];
  var STEPS = ["upload", "results"];
  var inp = { background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 10, padding: "8px 14px", color: "#e2e8f0", fontSize: 14, outline: "none" };

  function calcPVPR(row) {
    if (row.costeUSD == null) return null;
    var divisor = 1 - 0.15 - (targetMargin / 100);
    if (divisor <= 0) return null;
    return (row.costeUSD + row.gastosFBA + row.publicidad) / divisor;
  }


  function exportNoCost() {
    if (!rows) return;
    var noCost = rows.filter(function(r) { return !r.hasTariff; });
    if (noCost.length === 0) return;
    var headers = ["SKU", "ASIN", "Producto", "Ventas", "PVP", "Neto", "ACoS"];
    var data = noCost.map(function(r) {
      return [r.sku || "", r.producto || "", r.unidadesVendidas || 0, r.pvp || 0, r.precioUnidad || 0, r.acos != null ? r.acos * 100 : ""];
    });
    var ws = XLSX.utils.aoa_to_sheet([headers].concat(data));
    ws["!cols"] = [14, 32, 10, 12, 12, 10].map(function(w) { return { wch: w }; });
    var numFmt2 = "#.##0,00";
    var range2 = XLSX.utils.decode_range(ws["!ref"]);
    for (var R = 1; R <= range2.e.r; R++) {
      [3,4,5].forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = numFmt2;
      });
      [2].forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0";
      });
    }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sin coste");
    XLSX.writeFile(wb, "referencias-sin-coste.xlsx");
  }

  function exportToExcel() {
    var headers = ["SKU", "ASIN", "Producto", "Coste EUR", "Coste USD", "PVP", "Neto", "Ventas", "Devolucion", "Ratio Dev %", "Gastos FBA", "Comision", "Publicidad", "ACoS %", "Beneficio", "Beneficio %", "PVPR", "+ 365 dias", "Total"];
    function r2(v) { return v != null && v !== "" ? Math.round(v * 100) / 100 : ""; }
    function r0(v) { return v != null ? Math.round(v) : 0; }
    var data = sorted.map(function(r) {
      return [
        r.sku || "",
        r.asin || "",
        r.producto || "",
        r2(r.costeEUR),
        r2(r.costeUSD),
        r2(r.pvp),
        r2(r.precioUnidad),
        r0(r.unidadesVendidas),
        r0(r.devolucion),
        r2(r.ratioDevoluciones != null ? r.ratioDevoluciones * 100 : ""),
        r2(r.gastosFBA),
        r2(r.comision),
        r2(r.publicidad),
        r2(r.acos != null ? r.acos * 100 : ""),
        r2(r.beneficio),
        r2(r.beneficioPct),
        r2((function() { var p = calcPVPR(r); return p != null ? p : ""; })()),
        r.dias365 || "",
        r2(r.ingresosNetos)
      ];
    });
    var ws = XLSX.utils.aoa_to_sheet([headers].concat(data));
    ws["!cols"] = [12,14,30,11,11,10,10,9,11,10,11,11,11,9,11,11,10,10,10].map(function(w) { return { wch: w }; });
    // Apply European number format (#.##0,00) to numeric columns
    // Format string: #.##0,00 uses . as thousands sep and , as decimal sep in European Excel
    var numFmt = "#,##0.00";
    var pctFmt = "#,##0.00";
    // Numeric column indices (0-based): 3=CosteEUR,4=CosteUSD,5=PVP,6=Neto,8=Devolucion,9=RatioDev,10=GastosFBA,11=Comision,12=Publicidad,13=ACoS,14=Beneficio,15=BeneficioPct,16=PVPR,18=Total
    var numCols  = [3,4,5,6,8,10,11,12,14,15,16,18];
    var pctCols  = [9,13];
    var intCols  = [7, 8]; // Ventas, Devolucion
    var range = XLSX.utils.decode_range(ws["!ref"]);
    for (var R = 1; R <= range.e.r; R++) {
      numCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0.00";
      });
      pctCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0.00";
      });
      intCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0";
      });
    }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Knife Report");
    XLSX.writeFile(wb, "knife-report.xlsx");
  }

                        {"PVPR" + (sortC === "precioSugerido" ? (sortD === "asc" ? " \u2191" : " \u2193") : " \u2195")}
                        <span
                          title={"PVPR = (Coste USD + Gastos FBA + Publicidad) / (1 - 15% - 30%) | 15% es la comision de Amazon | " + targetMargin + "% es el rendimiento objetivo"}
                          style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 15, height: 15, borderRadius: "50%", background: "#1e3a5f", color: "#60a5fa", fontSize: 9, fontWeight: 800, cursor: "help", flexShrink: 0, lineHeight: 1 }}
                          onClick={function(e) { e.stopPropagation(); }}
                        >?</span>
                      </span></th>
                    <SortTh label="+ 365 dias" col="dias365" sortBy={sortC} sortDir={sortD} onSort={doSort} />
                    <th onClick={function() { doSort("ingresosNetos"); }} style={Object.assign({}, S.thR, { color: sortC === "ingresosNetos" ? "#60a5fa" : "#475569" })}>
                      <span style={{ display: "inline-flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
                        {"Total" + (sortC === "ingresosNetos" ? (sortD === "asc" ? " \u2191" : " \u2193") : " \u2195")}
                        <span
                          title="Suma de los ingresos netos por esta referencia"
                          style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 15, height: 15, borderRadius: "50%", background: "#1e3a5f", color: "#60a5fa", fontSize: 9, fontWeight: 800, cursor: "help", flexShrink: 0, lineHeight: 1 }}
                          onClick={function(e) { e.stopPropagation(); }}
                        >?</span>
                      </span></th>
                  </tr>
                  <tr>
                    {[
                      { col: "sku",               ph: "Filtrar SKU...", sticky: true },
                      { col: "asin",              ph: "Filtrar ASIN..."       },
                      { col: "producto",           ph: "Filtrar producto..."   },
                      { col: "costeEUR",           ph: "Min €"                },
                      { col: "costeUSD",           ph: "Min $"                },
                      { col: "pvp",               ph: "Min $"                },
                      { col: "precioUnidad",       ph: "Neto min"             },
                      { col: "unidadesVendidas",   ph: "Min"                  },
                      { col: "devolucion",         ph: "Min"                  },
                      { col: "ratioDevoluciones",  ph: "Ratio"                },
                      { col: "gastosFBA",          ph: "Min $"                },
                      { col: "comision",           ph: "Min $"                },
                      { col: "publicidad",         ph: "Min $"                },
                      { col: "acos",              ph: "ACoS"                 },
                      { col: "beneficio",          ph: "Min"                  },
                      { col: "beneficioPct",       ph: "Min %"                },
                      { col: "precioSugerido",     ph: "Min $"                },
                      { col: "dias365",            ph: "SI / No"              },
                      { col: "ingresosNetos",      ph: "Min $"                },
                    ].map(function(f, fi) {
                      return (
                        <td key={fi} style={{ padding: "4px 6px", background: "#060e1f", borderBottom: "1px solid #1e2d4a", position: f.sticky ? "sticky" : "static", left: f.sticky ? 0 : "auto", zIndex: f.sticky ? 2 : "auto" }}>
                          {f.col && (
                            <input
                              type="text"
                              placeholder={f.ph}
                              value={colFilters[f.col] || ""}
                              onChange={function(e) { var col = f.col; setColFilters(function(prev) { var nf = Object.assign({}, prev); if (e.target.value) nf[col] = e.target.value; else delete nf[col]; return nf; }); }}
                              style={{ width: "100%", background: colFilters[f.col] ? "#0d2040" : "#0a1020", border: "1px solid " + (colFilters[f.col] ? "#3b82f6" : "#1e2d4a"), borderRadius: 6, padding: "3px 7px", color: "#e2e8f0", fontSize: 11, outline: "none" }}
                            />
                          )}
                        </td>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {sorted.length === 0 && <tr><td colSpan={15} style={{ padding: 40, textAlign: "center", color: "#1e3a5f" }}>Sin resultados</td></tr>}
                  {sorted.map(function(row, fi) {
                    var i = rows.indexOf(row);                    return (
                      <tr key={fi} style={{ background: fi % 2 === 0 ? "transparent" : "#060e1f" }}>
                        <td style={Object.assign({}, S.tdL, { fontFamily: "monospace", color: "#94a3b8", maxWidth: 110, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", position: "sticky", left: 0, zIndex: 1, background: fi % 2 === 0 ? "#0d1829" : "#060e1f" })} title={row.sku || ""}>{row.sku || "-"}</td>
                        <td style={Object.assign({}, S.tdL, { fontFamily: "monospace", color: "#64748b", maxWidth: 120, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" })} title={row.asin || ""}>{row.asin || "-"}</td>
                        <td style={Object.assign({}, S.tdL, { maxWidth: 200 })}>
                          <div style={{ fontWeight: 600, color: row.hasTariff ? "#e2e8f0" : "#64748b", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={row.producto}>{row.producto || "-"}</div>
                          {!row.hasTariff && <div style={{ fontSize: 11, color: "#fbbf24" }}>sin tarifa</div>}
                        </td>
                        <td style={S.tdR}><span style={{ color: row.costeEUR != null ? "#e2e8f0" : "#334155" }}>{fEUR(row.costeEUR)}</span></td>
                        <td style={S.tdR}><span style={{ color: row.costeUSD != null ? "#e2e8f0" : "#334155" }}>{fUSD(row.costeUSD)}</span></td>
                              <td style={Object.assign({}, S.tdR, { color: "#fbbf24", fontWeight: 600 })}>{fUSD(row.pvp)}</td>
                  <td style={Object.assign({}, S.tdR, { color: "#fbbf24", fontWeight: 600 })}>{fUSD(row.precioUnidad)}</td>
                        <td style={S.tdR}><strong style={{ color: "#cbd5e1" }}>{row.unidadesVendidas}</strong></td>
                        <td style={Object.assign({}, S.tdR, { color: row.devolucion > 0 ? "#f87171" : "#334155" })}>{row.devolucion}</td>
                        <td style={Object.assign({}, S.tdR, { color: row.ratioDevoluciones != null && row.ratioDevoluciones > 0.1 ? "#f87171" : "#94a3b8" })}>{fPct(row.ratioDevoluciones)}</td>
                        <td style={Object.assign({}, S.tdR, { color: row.gastosFBA > 0 ? "#f87171" : "#334155" })}>{row.gastosFBA > 0 ? fUSD(row.gastosFBA) : "-"}</td>
                        <td style={Object.assign({}, S.tdR, { color: row.comision != 0 ? "#f87171" : "#334155" })}>{row.comision !== 0 ? fUSD(row.comision) : "-"}</td>
                        <td style={Object.assign({}, S.tdR, { color: row.publicidad <= 0 ? "#334155" : row.acos == null ? "#94a3b8" : row.acos < 0.10 ? "#4ade80" : row.acos <= 0.25 ? "#f97316" : "#f87171", fontWeight: row.publicidad > 0 ? 600 : 400 })}>{row.publicidad > 0 ? fUSD(row.publicidad) : "-"}</td>
                        <td style={Object.assign({}, S.tdR, { color: row.acos == null ? "#334155" : row.acos < 0.10 ? "#4ade80" : row.acos <= 0.25 ? "#f97316" : "#f87171", fontWeight: row.acos != null ? 600 : 400 })}>{fPct(row.acos)}</td>
                        <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: row.beneficio == null ? "#334155" : row.beneficio >= 0 ? "#4ade80" : "#f87171" })}>{row.beneficio != null ? fUSD(row.beneficio) : "-"}</td>
                        <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: row.beneficioPct == null ? "#334155" : row.beneficioPct >= 0 ? "#4ade80" : "#f87171" })}>{row.beneficioPct != null ? n2(row.beneficioPct, 1) + "%" : "-"}</td>
                        {(function() { var pvpr = calcPVPR(row); return <td style={Object.assign({}, S.tdR, { color: pvpr != null ? "#fbbf24" : "#334155", fontWeight: 600 })}>{pvpr != null ? fUSD(pvpr) : "-"}</td>; })()}
                        <td style={Object.assign({}, S.tdC, { fontWeight: 700, color: row.dias365 === "SI" ? "#4ade80" : "#f87171" })}>{row.dias365}</td>
                        <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: row.ingresosNetos >= 0 ? "#4ade80" : "#f87171" })}>{fUSD(row.ingresosNetos)}</td>
                      </tr>
                    );
                  })}
                </tbody>
                {sorted.length > 0 && (
                  <tfoot>
                    <tr style={{ background: "#0a1525", borderTop: "2px solid #1e3a5f" }}>
                      <td style={Object.assign({}, S.tdL, { fontWeight: 700, color: "#475569", fontSize: 11, textTransform: "uppercase", position: "sticky", left: 0, zIndex: 1, background: "#0a1525" })}>{"TOTAL (" + sorted.length + ")"}</td>
                      <td style={S.tdL}></td><td style={S.tdL}></td><td style={S.tdR}></td><td style={S.tdR}></td><td style={S.tdR}></td><td style={S.tdR}></td>
                      <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: "#e2e8f0" })}>{sumF("unidadesVendidas").toLocaleString("es-ES")}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#f87171" })}>{sumF("devolucion")}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#94a3b8" })}>{(function() { var vals = sorted.filter(function(r) { return r.ratioDevoluciones != null; }); return vals.length > 0 ? n2(vals.reduce(function(s,r) { return s + r.ratioDevoluciones; }, 0) / vals.length * 100, 1) + "%" : "-"; })()}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#f87171", fontWeight: 700 })}>{fUSD(sorted.reduce(function(s,r) { return s + (r.gastosFBA || 0); }, 0))}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#f87171", fontWeight: 700 })}>{fUSD(sorted.reduce(function(s,r) { return s + (r.comision || 0); }, 0))}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#f87171", fontWeight: 700 })}>{fUSD(sumF("publicidad"))}</td>
                      <td style={Object.assign({}, S.tdR, { color: "#94a3b8" })}>{(function() { var vals = sorted.filter(function(r) { return r.acos != null; }); return vals.length > 0 ? n2(vals.reduce(function(s,r) { return s + r.acos; }, 0) / vals.length * 100, 1) + "%" : "-"; })()}</td>
                      {(function() { var t = sorted.reduce(function(s,r) { return s + (r.beneficio != null ? r.beneficio : 0); }, 0); return <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: t >= 0 ? "#4ade80" : "#f87171" })}>{fUSD(t)}</td>; })()}
                      {(function() { var valid = sorted.filter(function(r) { return r.beneficioPct != null; }); var avg = valid.length > 0 ? valid.reduce(function(s,r) { return s + r.beneficioPct; }, 0) / valid.length : null; return <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: avg == null ? "#334155" : avg >= 0 ? "#4ade80" : "#f87171" })}>{avg != null ? n2(avg, 1) + "%" : "-"}</td>; })()}
                      <td style={S.tdR}></td>
                      <td style={S.tdR}></td>
                      <td style={S.tdC}></td>
                      <td style={Object.assign({}, S.tdR, { fontWeight: 700, color: "#4ade80" })}>{fUSD(sorted.reduce(function(s,r) { return s + (r.ingresosNetos || 0); }, 0))}</td>
                    </tr>
                  </tfoot>
                )}
              </table>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
