// ─── Parse TARIFF (standard sheet_to_json, row 1 = headers) ──────────────────
function parseTariffFile(file, hdrRow) {
  if (!hdrRow) hdrRow = 1;
  return new Promise(function(res, rej) {
    var name = file.name.toLowerCase();
    if (name.endsWith(".csv") || name.endsWith(".txt")) {
      var r = new FileReader();
      r.onload = function(e) {
        try {
          var result = hdrRow <= 1
            ? Papa.parse(e.target.result, { header: true, skipEmptyLines: true, dynamicTyping: false })
            : (function() { var r = Papa.parse(e.target.result, { header: false, skipEmptyLines: true }); var rows = r.data; var hdrs = rows[hdrRow-1] || []; var data = rows.slice(hdrRow).map(function(row) { var obj = {}; hdrs.forEach(function(h,i){ obj[String(h).trim()] = row[i] || ""; }); return obj; }); return { data: data }; })();
          if (!result.data || result.data.length === 0) { rej(new Error("El CSV esta vacio.")); return; }
          var cleaned = result.data.map(function(row) {
            var out = {};
            Object.keys(row).forEach(function(k) { if (k && !k.startsWith("__EMPTY")) out[k.trim()] = row[k]; });
            return out;
          });
          res(cleaned);
        } catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r.readAsText(file, "UTF-8");
    } else {
      var r2 = new FileReader();
      r2.onload = function(e) {
        try {
          var wb = XLSX.read(e.target.result, { type: "array" });
          var ws = wb.Sheets[wb.SheetNames[0]];
          if (!ws || !ws["!ref"]) { rej(new Error("Hoja vacia en " + file.name)); return; }
          var raw = XLSX.utils.sheet_to_json(ws, { defval: "", range: hdrRow - 1 });
          if (raw.length === 0) {
            var rng = XLSX.utils.decode_range(ws["!ref"]);
            rej(new Error("Sin datos. Rango: " + ws["!ref"] + " (" + (rng.e.r + 1) + " filas). Asegurate de que la cabecera este en fila 1.")); return;
          }
          var cleaned2 = raw.map(function(row) {
            var out = {};
            Object.keys(row).forEach(function(k) { if (k && !k.startsWith("__EMPTY")) out[k.trim()] = row[k]; });
            return out;
          });
          res(cleaned2);
        } catch(err) { rej(err); }
      };
      r2.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r2.readAsArrayBuffer(file);
    }
  });
}

// ─── Parse AMAZON (cell-by-cell, stores by header name AND _col_X) ────────────
function parseAmazonFile(file, headerRow) {
  return new Promise(function(res, rej) {
    var name = file.name.toLowerCase();
    var hIdx = headerRow - 1;

    function buildRows(rawRows) {
      if (rawRows.length <= hIdx) return [];
      var headers = rawRows[hIdx].map(function(h) { return String(h != null ? h : "").trim(); });
      var data = [];
      for (var r = hIdx + 1; r < rawRows.length; r++) {
        var row = {}; var hasData = false;
        for (var ci = 0; ci < rawRows[r].length; ci++) {
          var val    = rawRows[r][ci] != null ? rawRows[r][ci] : "";
          var colKey = "_col_" + XLSX.utils.encode_col(ci);
          var hName  = headers[ci] || "";
          row[colKey] = val;
          if (hName) row[hName] = val;
          if (String(val).trim() !== "") hasData = true;
        }
        if (hasData) data.push(row);
      }
      return data;
    }

    function parseAsText(text) {
      // Try tab-separated first, then comma
      var sep = text.indexOf("\t") > -1 ? "\t" : ",";
      var result = Papa.parse(text, { header: false, skipEmptyLines: true, delimiter: sep });
      return buildRows(result.data);
    }

    function tryXLSX(buffer) {
      try {
        // Suppress XLSX console noise during parse
        var _origError = console.error;
        var _origWarn  = console.warn;
        console.error = function() {};
        console.warn  = function() {};
        var wb;
        try {
          wb = XLSX.read(buffer, { type: "array", WTF: false, cellNF: false, cellStyles: false, cellDates: false });
        } finally {
          console.error = _origError;
          console.warn  = _origWarn;
        }
        var ws = wb.Sheets[wb.SheetNames[0]];
        if (!ws || !ws["!ref"]) return null;
        var range = XLSX.utils.decode_range(ws["!ref"] || "A1");
        var rawRows = [];
        for (var ri = range.s.r; ri <= range.e.r; ri++) {
          var row2 = [];
          for (var ci = range.s.c; ci <= range.e.c; ci++) {
            var cell = ws[XLSX.utils.encode_cell({ r: ri, c: ci })];
            row2.push(cell != null ? (cell.w || String(cell.v != null ? cell.v : "")) : "");
          }
          rawRows.push(row2);
        }
        return buildRows(rawRows);
      } catch(e) { return null; }
    }

    if (name.endsWith(".csv") || name.endsWith(".txt")) {
      var r = new FileReader();
      r.onload = function(e) {
        try { res(parseAsText(e.target.result)); }
        catch(err) { rej(err); }
      };
      r.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r.readAsText(file, "UTF-8");
    } else {
      // Try as binary Excel first, fall back to reading as text (some Amazon exports are TSV with .xlsx extension)
      var r2 = new FileReader();
      r2.onload = function(e) {
        var xlsxResult = tryXLSX(e.target.result);
        if (xlsxResult && xlsxResult.length > 0) {
          res(xlsxResult);
        } else {
          // Fallback: read as text (handles TSV/CSV disguised as xlsx)
          var r3 = new FileReader();
          r3.onload = function(e2) {
            try { res(parseAsText(e2.target.result)); }
            catch(err) { rej(new Error("No se pudo leer el archivo. Prueba a exportarlo como CSV desde Excel.")); }
          };
          r3.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
          r3.readAsText(file, "UTF-8");
        }
      };
      r2.onerror = function() { rej(new Error("Error leyendo " + file.name)); };
      r2.readAsArrayBuffer(file);
    }
  });
}

// ─── Auto-detect helpers ──────────────────────────────────────────────────────
function detectTariffCols(headers) {
  function find(pats) {
    for (var i = 0; i < headers.length; i++) {
      for (var j = 0; j < pats.length; j++) {
        if (pats[j].test(String(headers[i]).trim())) return headers[i];
      }
    }
    return null;
  }
  var sku   = find([/^sku$/i, /^ref/i, /^cod/i, /^referencia/i, /^codigo/i, /^articulo/i]);
  var price = find([/coste.euros/i, /coste.eur/i, /coste.unit/i, /precio.unit/i, /p\.unit/i, /^precio$/i, /^coste$/i, /^cost$/i, /^pvp$/i, /unit.price/i, /^price$/i]);
  // Fallback for 2-col files: col 0 = SKU, col 1 = price
  if (!sku   && headers.length >= 1) sku   = headers[0];
  if (!price && headers.length >= 2) price = headers[1];
  return { sku: sku, model: null, price: price, curr: null };
}

function detectAmazonCols(headers) {
  function find(pats) {
    for (var i = 0; i < headers.length; i++) {
      if (/^_col_/.test(headers[i])) continue;
      for (var j = 0; j < pats.length; j++) {
        if (pats[j].test(String(headers[i]))) return headers[i];
      }
    }
    return null;
  }
  return {
    sku:     find([/^sku$/i, /seller.?sku/i]),
    asin:    find([/^asin$/i]),
    product: find([/^title$/i, /^titulo$/i, /product.?name/i, /nombre.?del.?producto/i, /^nombre/i, /descripci/i]),
  };
}

// ─── Number helpers ───────────────────────────────────────────────────────────
function toNum(v) {
  if (v == null || v === "") return 0;
  if (typeof v === "number") return v;
  var s = String(v).trim().replace(/[€$£%\s]/g, "");
  if (/\.\d{3}(,|$)/.test(s) || (s.indexOf(",") > -1 && s.indexOf(".") > -1)) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else {
    s = s.replace(",", ".");
  }
  var n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function toPct(v) {
  if (v == null || v === "") return null;
  var s = String(v).trim();
  var n = parseFloat(s.replace("%", "").replace(",", "."));
  if (isNaN(n)) return null;
  return s.indexOf("%") > -1 ? n / 100 : n;
}

function normSKU(s) {
  return String(s != null ? s : "").trim().toUpperCase().replace(/\s+/g, " ");
}

// ─── Formatters ───────────────────────────────────────────────────────────────
function n2(v, d) {
  if (d === undefined) d = 2;
  if (v == null) return "-";
  return Number(v).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fEUR(v) { return v == null ? "-" : "\u20ac" + n2(v); }
function fUSD(v) { return v == null ? "-" : "$" + n2(v); }
function fPct(v) { return v == null ? "-" : n2(v * 100, 1) + "%"; }
function bCol(v) { return v == null ? "#334155" : v >= 0 ? "#4ade80" : "#f87171"; }

// ─── DropFile ─────────────────────────────────────────────────────────────────
function DropFile(props) {
  var isDragState = useState(false);
  var isDrag = isDragState[0], setDrag = isDragState[1];
  var ref = useRef(null);
  return (
    <div
      onDragOver={function(e) { e.preventDefault(); setDrag(true); }}
      onDragLeave={function() { setDrag(false); }}
      onDrop={function(e) { e.preventDefault(); setDrag(false); var f = e.dataTransfer.files[0]; if (f) props.onFile(f); }}
      onClick={function() { if (ref.current) ref.current.click(); }}
      style={{ border: "2px dashed " + (isDrag ? props.color : props.file ? props.color + "99" : "#1e3a5f"), background: props.file ? props.color + "12" : "#0d1829", borderRadius: 14, padding: 22, textAlign: "center", cursor: "pointer" }}
    >
      <input ref={ref} type="file" accept={props.accept} style={{ display: "none" }} onChange={function(e) { if (e.target.files[0]) props.onFile(e.target.files[0]); }} />
      <div style={{ fontSize: 28, marginBottom: 8 }}>{props.icon}</div>
      <div style={{ fontWeight: 700, color: "#e2e8f0", fontSize: 14 }}>{props.label}</div>
      <div style={{ fontSize: 12, color: "#475569", marginTop: 4 }}>{props.desc}</div>
      {props.file
        ? <div style={{ fontSize: 12, color: props.color, marginTop: 10, fontWeight: 600 }}>{"✓ " + props.file.name}</div>
        : <div style={{ fontSize: 11, color: "#334155", marginTop: 10, border: "1px solid #1e3a5f", borderRadius: 6, padding: "3px 12px", display: "inline-block" }}>Arrastra o haz clic</div>}
    </div>
  );
}

// ─── ColPick ──────────────────────────────────────────────────────────────────
function ColPick(props) {
  var nameHeaders = props.headers.filter(function(h) { return !String(h).startsWith("_col_"); });
  var preview = null;
  if (props.value && props.data && props.data.length > 0) {
    preview = props.data.slice(0, 3).map(function(r) { return String(r[props.value] != null ? r[props.value] : ""); }).filter(Boolean).join("  ·  ");
  }
  return (
    <div>
      <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 5, fontWeight: 600 }}>
        {props.label}{props.required !== false && <span style={{ color: "#f87171", marginLeft: 4 }}>*</span>}
      </div>
      <select value={props.value || ""} onChange={function(e) { props.onChange(e.target.value || null); }} style={S.sel}>
        <option value="">— no usar —</option>
        {nameHeaders.map(function(h) { return <option key={h} value={h}>{h}</option>; })}
      </select>
      {preview && <div style={{ fontSize: 11, color: "#4ade80", marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{"ej: " + preview}</div>}
    </div>
  );
}

// ─── ColLetter ────────────────────────────────────────────────────────────────
function ColLetter(props) {
  var col    = "_col_" + String(props.value || "").toUpperCase();
  var exists = props.value && props.data && props.data.length > 0 && props.data[0][col] !== undefined;
  var preview = exists ? props.data.slice(0, 2).map(function(r) { var v = r[col]; return v != null && v !== "" ? String(v).slice(0, 20) : null; }).filter(Boolean).join("  ·  ") : null;
  return (
    <div>
      <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 5, fontWeight: 600 }}>{props.label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <input value={props.value} onChange={function(e) { props.onChange(e.target.value.toUpperCase()); }}
          style={{ background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 10, padding: "6px 8px", color: "#e2e8f0", fontSize: 14, fontWeight: 700, fontFamily: "monospace", outline: "none", width: 56, textAlign: "center" }}
          placeholder="A" />
        {props.hint && <span style={{ fontSize: 11, color: "#334155" }}>{props.hint}</span>}
      </div>
      {props.value && (exists
        ? <div style={{ fontSize: 11, color: "#4ade80", marginTop: 3 }}>{"✓ " + (preview || "(vacia)")}</div>
        : <div style={{ fontSize: 11, color: "#f87171", marginTop: 3 }}>Columna no encontrada</div>)}
    </div>
  );
}

// ─── SortTh ───────────────────────────────────────────────────────────────────
function SortTh(props) {
  var active = props.sortBy === props.col;
  var base   = props.left ? S.thL : S.thR;
  return (
    <th onClick={function() { props.onSort(props.col); }} style={Object.assign({}, base, { color: active ? "#60a5fa" : "#475569" })}>
      {props.label + (active ? (props.sortDir === "asc" ? " \u2191" : " \u2193") : " \u2195")}
    </th>
  );
}

  function exportToExcel() {
    // Headers must match data array 1:1
    var headers = [
      "SKU",          // 0
      "ASIN",         // 1
      "PESO (kg)",    // 2
      "Envio USD",    // 3
      "Producto",     // 4
      "Coste EUR",    // 5
      "Coste USD",    // 6
      "PVP",          // 7
      "Neto",         // 8
      "Ventas",       // 9
      "Devolucion",   // 10
      "Ratio Dev %",  // 11
      "Gastos FBA",   // 12
      "Comision",     // 13
      "Publicidad",   // 14
      "ACoS %",       // 15
      "Beneficio",    // 16
      "Beneficio %",  // 17
      "PVPR",         // 18
      "+ 365 dias",   // 19
      "Total"         // 20
    ];
    function r2(v) { return v != null && v !== "" ? Math.round(v * 100) / 100 : ""; }
    function r0(v) { return v != null ? Math.round(Number(v)) : 0; }
    var data = sorted.map(function(r) {
      return [
        r.sku || "",                                             // 0  SKU
        r.asin || "",                                            // 1  ASIN
        r2(r.peso),                                              // 2  PESO
        r2(r.envio),                                             // 3  Envio
        r.producto || "",                                        // 4  Producto
        r2(r.costeEUR),                                          // 5  Coste EUR
        r2(r.costeUSD),                                          // 6  Coste USD
        r2(r.pvp),                                               // 7  PVP
        r2(r.precioUnidad),                                      // 8  Neto
        r0(r.unidadesVendidas),                                  // 9  Ventas
        r0(r.devolucion),                                        // 10 Devolucion
        r2(r.ratioDevoluciones != null ? r.ratioDevoluciones * 100 : ""), // 11 Ratio Dev %
        r2(r.gastosFBA),                                         // 12 Gastos FBA
        r2(r.comision),                                          // 13 Comision
        r2(r.publicidad),                                        // 14 Publicidad
        r2(r.acos != null ? r.acos * 100 : ""),                  // 15 ACoS %
        r2(r.beneficio),                                         // 16 Beneficio
        r2(r.beneficioPct),                                      // 17 Beneficio %
        r2((function() { var p = calcPVPR(r); return p != null ? p : ""; })()), // 18 PVPR
        r.dias365 || "",                                         // 19 + 365 dias
        r2(r.ingresosNetos)                                      // 20 Total
      ];
    });
    var ws = XLSX.utils.aoa_to_sheet([headers].concat(data));
    ws["!cols"] = [12,14,10,10,30,11,11,10,10,9,10,10,11,11,11,9,11,11,10,10,12].map(function(w) { return { wch: w }; });
    var numFmt = "#,##0.00";
    // 0-based column indices for number format
    var numCols = [2,3,5,6,7,8,12,13,14,16,17,18,20];
    var pctCols = [11,15];
    var intCols = [9,10];
    var range = XLSX.utils.decode_range(ws["!ref"]);
    for (var R = 1; R <= range.e.r; R++) {
      numCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0.00";
      });
      pctCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0.00";
      });
      intCols.forEach(function(C) {
        var addr = XLSX.utils.encode_cell({ r: R, c: C });
        if (ws[addr] && typeof ws[addr].v === "number") ws[addr].z = "#,##0";
      });
    }
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Knife Report");
    XLSX.writeFile(wb, "knife-report.xlsx");
  }

// ─── HISTORICO SCREEN ──────────────────────────────────────────────
function HistoricoScreen(props) {
  var histData    = props.histData;
  var histStatus  = props.histStatus;
  var histPeriod  = props.histPeriod;
  var histFrom    = props.histFrom;
  var histTo      = props.histTo;
  var histSku     = props.histSku;
  var lossMonths  = props.lossMonths || 2;
  var eurUsd      = props.eurUsd;
  var MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var YEARS = ["2022","2023","2024","2025","2026","2027","2028","2029","2030"];

  function fUSD(v) { return "$" + (v == null ? "0.00" : Number(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")); }
  function fEUR(v) { return (v == null ? "0.00" : Number(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + " \u20ac"; }
  function n2(v, d) { return Number(v).toFixed(d != null ? d : 2); }

  // Get unique sorted months from data
  function getMonths() {
    var all = {};
    histData.forEach(function(r) {
      // Try various possible column names for the date
      var f = r["Fecha"] || r["fecha"] || r["FECHA"] || Object.values(r)[0];
      if (f && String(f).match(/^\d{4}-\d{2}/)) all[String(f)] = true;
    });
    return Object.keys(all).sort();
  }
  var allMonths = getMonths();

  // Filter months by selected period
  function getFilteredMonths() {
    if (!allMonths.length) return [];
    if (histPeriod === "custom") {
      return allMonths.filter(function(m) { return (!histFrom || m >= histFrom) && (!histTo || m <= histTo); });
    }
    var n = histPeriod === "1M" ? 1 : histPeriod === "3M" ? 3 : histPeriod === "6M" ? 6 : histPeriod === "1Y" ? 12 : 24;
    return allMonths.slice(-n);
  }
  var filteredMonths = getFilteredMonths();

  // Aggregate by month
  function getDateKey(r) { return String(r["fecha"] || ""); }
  function getSkuKey(r) { return String(r["sku"] || ""); }

  function aggByMonth(field, agg) {
    return filteredMonths.map(function(mo) {
      var rows = histData.filter(function(r) { return r.fecha === mo; });
      if (!rows.length) return { month: mo, value: 0 };
      if (agg === "sum") {
        var val = rows.reduce(function(s, r) { return s + (parseFloat(r[field]) || 0); }, 0);
        return { month: mo, value: val };
      }
      if (agg === "avg") {
        var vals = rows.filter(function(r) { var v = r[field]; return v != null && v !== "" && !isNaN(parseFloat(v)); });
        return { month: mo, value: vals.length ? vals.reduce(function(s,r) { return s+(parseFloat(r[field])||0); }, 0)/vals.length : 0 };
      }
      return { month: mo, value: 0 };
    });
  }

  // Sum field1 * field2 per row (e.g. publicidad * unidades)
  function aggProductByMonth(field1, field2) {
    return filteredMonths.map(function(mo) {
      var rows = histData.filter(function(r) { return r.fecha === mo; });
      var val = rows.reduce(function(s, r) {
        return s + (parseFloat(r[field1]) || 0) * (parseFloat(r[field2]) || 0);
      }, 0);
      return { month: mo, value: val };
    });
  }

  // SVG line chart
  function LineChart(p) {
    var data = p.data;
    var color = p.color || "#4ade80";
    var h = 160; var w = 600;
    var padL = 55; var padR = 20; var padT = 24; var padB = 36;
    var chartW = w - padL - padR;
    var chartH = h - padT - padB;
    if (!data || data.length < 1) return <div style={{ color: "#334155", fontSize: 11, padding: 20, textAlign: "center" }}>Sin datos suficientes</div>;
    var vals = data.map(function(d) { return d.value; });
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    var range = max - min || 1;
    var pts = data.map(function(d, i) {
      var x = padL + (data.length > 1 ? (i / (data.length - 1)) * chartW : chartW / 2);
      var yRaw = padT + chartH - ((d.value - min) / range) * chartH;
      var y = isNaN(yRaw) || !isFinite(yRaw) ? padT + chartH/2 : yRaw;
      return { x: x, y: y, v: d.value, m: d.month };
    });
    var path = pts.map(function(pt, i) { return (i === 0 ? "M" : "L") + pt.x.toFixed(1) + "," + pt.y.toFixed(1); }).join(" ");
    var fillPath = path + " L" + pts[pts.length-1].x.toFixed(1) + "," + (padT+chartH) + " L" + pts[0].x.toFixed(1) + "," + (padT+chartH) + " Z";
    var MESES_S = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
    return (
      <svg viewBox={"0 0 " + w + " " + h} style={{ width: "100%", height: "auto" }}>
        <line x1={padL} y1={padT} x2={padL} y2={padT+chartH} stroke="#1e3a5f" strokeWidth="1" />
        <line x1={padL} y1={padT+chartH} x2={padL+chartW} y2={padT+chartH} stroke="#1e3a5f" strokeWidth="1" />
        <text x={padL-6} y={padT+4} textAnchor="end" fontSize="9" fill="#475569">{p.fmt ? p.fmt(max) : n2(max,1)}</text>
        <text x={padL-6} y={padT+chartH+4} textAnchor="end" fontSize="9" fill="#475569">{p.fmt ? p.fmt(min) : n2(min,1)}</text>
        <path d={fillPath} fill={color} fillOpacity="0.08" />
        <path d={path} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" />
        {pts.map(function(pt, i) {
          var mo = parseInt(pt.m.split("-")[1]) - 1;
          return (
            <g key={i}>
              <circle cx={pt.x} cy={pt.y} r="3" fill={color} stroke="#0d1829" strokeWidth="1.5" />
              <text x={pt.x} y={padT+chartH+14} textAnchor="middle" fontSize="10" fill="#475569">{MESES_S[mo] || pt.m.slice(5)}</text>
              <text x={pt.x} y={pt.y - 7} textAnchor="middle" fontSize="10" fill={color}>{p.fmt ? p.fmt(pt.v) : n2(pt.v, 1)}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  // SKU data
  var skuMonths = histSku ? filteredMonths.map(function(mo) {
    var row = histData.find(function(r) { return r.fecha === mo && r.sku === histSku; });
    return { month: mo, beneficioPct: row ? row.beneficioPct : null,
             ventas: row ? row.unidades : null,
             acos: row ? row.acos : null,
             total: row ? row.total : null };
  }) : [];

  // Unique SKUs
  var allSkus = (function() {
    var s = {};
    histData.forEach(function(r) { if (r.sku) s[r.sku] = true; });
    return Object.keys(s).sort();
  })();

  // Alert: consecutive loss months
  var lossSkus = allSkus.filter(function(sku) {
    var lastN = filteredMonths.slice(-lossMonths);
    return lastN.length >= lossMonths && lastN.every(function(mo) {
      var row = histData.find(function(r) { return r.fecha === mo && r.sku === sku; });
      return row && row.beneficioPct < 0;
    });
  });

  var totalBenData  = aggByMonth("total", "sum");
  var acosData = filteredMonths.map(function(mo) {
    var rows = histData.filter(function(r) { return r.fecha === mo; });
    var totalPub   = rows.reduce(function(s,r) { return s + (parseFloat(r.publicidad)||0) * (parseFloat(r.unidades)||0); }, 0);
    var totalVentas= rows.reduce(function(s,r) { return s + (parseFloat(r.pvp)||0) * (parseFloat(r.unidades)||0); }, 0);
    return { month: mo, value: totalVentas > 0 ? (totalPub / totalVentas) * 100 : 0 };
  });
  var ventasData    = aggByMonth("unidades", "sum");
  var pubData       = aggByMonth("publicidad", "sum");

  var totalBenSum = totalBenData.reduce(function(s,d) { return s+d.value; }, 0);
  var avgAcosVal = (function() {
    var totalPub    = histData.filter(function(r) { return filteredMonths.indexOf(r.fecha) > -1; })
                              .reduce(function(s,r) { return s + (parseFloat(r.publicidad)||0)*(parseFloat(r.unidades)||0); }, 0);
    var totalVentas = histData.filter(function(r) { return filteredMonths.indexOf(r.fecha) > -1; })
                              .reduce(function(s,r) { return s + (parseFloat(r.pvp)||0)*(parseFloat(r.unidades)||0); }, 0);
    return totalVentas > 0 ? (totalPub / totalVentas) * 100 : 0;
  })();

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div>
          <h2 style={{ fontSize: 17, fontWeight: 800, color: "#f1f5f9", margin: 0 }}>Histórico</h2>
          <div style={{ fontSize: 12, color: "#475569", marginTop: 4 }}>{histData.length > 0 ? histData.length + " registros · " + allMonths.length + " meses" : "Sin datos"}</div>
        </div>
        <button onClick={props.loadHistorico} disabled={histStatus === "loading"} style={{ background: histStatus === "loading" ? "#1e3a5f" : "#7c3aed", color: histStatus === "loading" ? "#475569" : "#fff", border: "none", borderRadius: 10, padding: "8px 16px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
          {histStatus === "loading" ? "Cargando..." : "☁ Cargar histórico"}
        </button>
      </div>

      {histStatus === "idle" && histData.length === 0 && (
        <div style={{ background: "#0d1829", border: "1px solid #1e2d4a", borderRadius: 14, padding: 40, textAlign: "center", color: "#475569" }}>
          <div style={{ fontSize: 32, marginBottom: 12 }}>📊</div>
          <div style={{ fontSize: 15, color: "#94a3b8", marginBottom: 8 }}>Pulsa "Cargar histórico" para ver la evolución</div>
          <div style={{ fontSize: 12 }}>Los datos se leen desde la pestaña Histórico de tu Google Sheet</div>
        </div>
      )}

      {histStatus === "ok" && histData.length > 0 && (
        <div>
          {/* Period selector */}
          <div style={{ background: "#0d1829", border: "1px solid #1e2d4a", borderRadius: 12, padding: 14, marginBottom: 20, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <span style={{ fontSize: 12, color: "#475569", marginRight: 4 }}>Periodo:</span>
            {["1M","3M","6M","1Y","2Y","custom"].map(function(p) {
              return (
                <button key={p} onClick={function() { props.setHistPeriod(p); }} style={{ background: histPeriod === p ? "#1d4ed8" : "#060e1f", color: histPeriod === p ? "#fff" : "#94a3b8", border: "1px solid " + (histPeriod === p ? "#1d4ed8" : "#1e3a5f"), borderRadius: 8, padding: "5px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>{p === "custom" ? "Personalizado" : p}</button>
              );
            })}
            {histPeriod === "custom" && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: "#475569" }}>Desde:</span>
                <select value={histFrom} onChange={function(e) { props.setHistFrom(e.target.value); }} style={{ background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 6, color: "#e2e8f0", fontSize: 12, padding: "4px 8px", outline: "none" }}>
                  <option value="">Inicio</option>
                  {allMonths.map(function(m) { return <option key={m} value={m}>{(function(){ var p=m.split("-"); return (MESES[parseInt(p[1])-1]||p[1])+" "+p[0]; })()}</option>; })}
                </select>
                <span style={{ fontSize: 12, color: "#475569" }}>Hasta:</span>
                <select value={histTo} onChange={function(e) { props.setHistTo(e.target.value); }} style={{ background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 6, color: "#e2e8f0", fontSize: 12, padding: "4px 8px", outline: "none" }}>
                  <option value="">Fin</option>
                  {allMonths.map(function(m) { return <option key={m} value={m}>{(function(){ var p=m.split("-"); return (MESES[parseInt(p[1])-1]||p[1])+" "+p[0]; })()}</option>; })}
                </select>
              </div>
            )}
          </div>

          {/* KPIs */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
            {[
              { label: "Beneficio periodo", v: fUSD(totalBenSum), sub: "≈ " + fEUR(totalBenSum / eurUsd), color: totalBenSum >= 0 ? "#4ade80" : "#f87171" },
              { label: "ACoS medio", v: n2(avgAcosVal, 1) + "%", sub: filteredMonths.length + " meses analizados", color: avgAcosVal < 15 ? "#4ade80" : avgAcosVal < 25 ? "#fbbf24" : "#f87171" },
              { label: "Referencias", v: allSkus.length, sub: "en el histórico", color: "#60a5fa" },
              { label: "En pérdidas recientes", v: lossSkus.length, sub: "≥2 meses consecutivos", color: lossSkus.length > 0 ? "#f87171" : "#4ade80" },
            ].map(function(k, i) {
              return (
                <div key={i} style={{ background: "#0d1829", border: "1px solid #1e2d4a", borderRadius: 12, padding: 16 }}>
                  <div style={{ fontSize: 11, color: "#475569", fontWeight: 600, textTransform: "uppercase", letterSpacing: ".05em", marginBottom: 6 }}>{k.label}</div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: k.color }}>{k.v}</div>
                  <div style={{ fontSize: 11, color: "#334155", marginTop: 4 }}>{k.sub}</div>
                </div>
              );
            })}
          </div>

          {/* Charts 2x2 */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
            {[
              { title: "Beneficio Total mensual", data: totalBenData, color: "#4ade80", fmt: function(v) { return "$" + Math.round(v); } },
              { title: "ACoS medio mensual (%)", data: acosData, color: "#fbbf24", fmt: function(v) { return n2(v,1)+"%"; } },
              { title: "Unidades vendidas", data: ventasData, color: "#60a5fa", fmt: function(v) { return Math.round(v)+"u"; } },
              { title: "Gasto publicidad mensual", data: pubData, color: "#f87171", fmt: function(v) { return "$"+Math.round(v); } },
            ].map(function(ch, i) {
              return (
                <div key={i} style={{ background: "#0d1829", border: "1px solid #1e2d4a", borderRadius: 12, padding: 16 }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: "#cbd5e1", marginBottom: 12 }}>{ch.title}</div>
                  <LineChart data={ch.data} color={ch.color} fmt={ch.fmt} />
                </div>
              );
            })}
          </div>

          {/* SKU search */}
          <div style={{ background: "#0d1829", border: "1px solid #1e2d4a", borderRadius: 12, padding: 20, marginBottom: 20 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#cbd5e1", marginBottom: 12 }}>🔍 Evolución por referencia</div>
            <div style={{ display: "flex", gap: 10, marginBottom: 16, alignItems: "center", flexWrap: "wrap" }}>
              <div style={{ position: "relative", flex: 1, maxWidth: 360 }}>
                <input
                  type="text"
                  placeholder="Buscar SKU... (ej: JO-CM146)"
                  value={histSku}
                  onChange={function(e) { props.setHistSku(e.target.value); }}
                  style={{ width: "100%", background: "#060e1f", border: "1px solid #1e3a5f", borderRadius: 8, color: "#e2e8f0", fontSize: 13, padding: "8px 12px", outline: "none" }}
                />
                {histSku && allSkus.indexOf(histSku) === -1 && (
                  <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#0d1829", border: "1px solid #1e3a5f", borderRadius: 8, marginTop: 4, maxHeight: 200, overflowY: "auto", zIndex: 100 }}>
                    {allSkus.filter(function(s) { return s.toLowerCase().indexOf(histSku.toLowerCase()) > -1; }).slice(0,20).map(function(s) {
                      return <div key={s} onClick={function() { props.setHistSku(s); }} style={{ padding: "7px 12px", fontSize: 13, color: "#94a3b8", cursor: "pointer", fontFamily: "monospace" }}
                        onMouseOver={function(e) { e.target.style.background="#1e3a5f"; e.target.style.color="#fff"; }}
                        onMouseOut={function(e) { e.target.style.background="transparent"; e.target.style.color="#94a3b8"; }}
                      >{s}</div>;
                    })}
                  </div>
                )}
              </div>
              {histSku && allSkus.indexOf(histSku) > -1 && (
                <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
                  <span style={{ fontSize: 12, color: "#475569" }}>{"Datos en " + skuMonths.filter(function(m) { return m.total != null; }).length + " de " + filteredMonths.length + " meses"}</span>
                  <button onClick={function() { props.setHistSku(""); }} style={{ background: "transparent", border: "1px solid #334155", borderRadius: 6, color: "#475569", fontSize: 11, padding: "3px 8px", cursor: "pointer" }}>✕ Limpiar</button>
                </div>
              )}
            </div>
            {histSku && allSkus.indexOf(histSku) > -1 && skuMonths.length > 0 && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                <div>
                  <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 8 }}>Beneficio % mensual</div>
                  <LineChart data={skuMonths.map(function(m) { return { month: m.month, value: m.beneficioPct || 0 }; })} color="#4ade80" fmt={function(v) { return n2(v,1)+"%"; }} />
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 8 }}>Total generado mensual</div>
                  <LineChart data={skuMonths.map(function(m) { return { month: m.month, value: m.total || 0 }; })} color="#60a5fa" fmt={function(v) { return "$"+Math.round(v); }} />
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 8 }}>Unidades vendidas</div>
                  <LineChart data={skuMonths.map(function(m) { return { month: m.month, value: m.ventas || 0 }; })} color="#fbbf24" fmt={function(v) { return Math.round(v)+"u"; }} />
                </div>
                <div>
                  <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 8 }}>ACoS %</div>
                  <LineChart data={skuMonths.map(function(m) { return { month: m.month, value: m.acos || 0 }; })} color="#f87171" fmt={function(v) { return n2(v,1)+"%"; }} />
                </div>
              </div>
            )}
          </div>

          {/* Loss alerts */}
          <div style={{ background: "#1a0f0f", border: "1px solid #7f1d1d", borderRadius: 12, padding: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#f87171" }}>🚨 Referencias en pérdidas consecutivas ({lossSkus.length})</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: "auto" }}>
                  <span style={{ fontSize: 11, color: "#475569" }}>Meses consecutivos:</span>
                  {[2,3,4,5,6].map(function(n) {
                    return <button key={n} onClick={function() { props.setLossMonths(n); }} style={{ background: lossMonths === n ? "#7f1d1d" : "#2d0f0f", color: lossMonths === n ? "#fca5a5" : "#f87171", border: "1px solid #7f1d1d", borderRadius: 6, padding: "3px 9px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{n}</button>;
                  })}
                </div>
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {lossSkus.map(function(sku) {
                  return <span key={sku} onClick={function() { props.setHistSku(sku); }} style={{ background: "#2d0f0f", color: "#f87171", border: "1px solid #7f1d1d", borderRadius: 8, padding: "4px 12px", fontSize: 12, fontFamily: "monospace", cursor: "pointer" }}>{sku}</span>;
                })}
              {lossSkus.length === 0 && <div style={{ fontSize: 12, color: "#475569", marginTop: 8 }}>{"Ninguna referencia lleva " + lossMonths + " meses consecutivos en pérdidas"}</div>}
              </div>
            </div>
        </div>
      )}

      {histStatus === "error" && <div style={{ color: "#f87171", padding: 20 }}>Error al cargar el histórico. Verifica que la pestaña Histórico está publicada en Google Sheets.</div>}
      {histStatus === "empty" && <div style={{ color: "#475569", padding: 20 }}>La pestaña Histórico está vacía. Guarda algunos meses primero desde la pantalla de Informe.</div>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
